[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
    witnessmenow/UniversalTelegramBot@^1.3.0

; Over-the-air updates via WiFi (password = OTA_PASSWORD in config.h)
upload_protocol = espota
upload_port = greenguardian.local
; fixed host port so the firewall can allow it:
;   sudo ufw allow from 192.168.178.0/24 to any port 8266 proto tcp
upload_flags =
    --auth=growgreen
    --host_port=8266

; Flash via USB instead: pio run -e esp32dev_usb -t upload
[env:esp32dev_usb]
extends = env:esp32dev
upload_protocol = esptool
upload_port = /dev/ttyUSB0
upload_flags =
