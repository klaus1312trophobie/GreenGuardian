; Green Guardian – tent camera (AI-Thinker ESP32-CAM, optional ESP32-CAM-MB USB board)
; Shares ../include/config.h (WiFi, Telegram, OTA password) with the sensor ESP32.
;
;   First flash via USB:   pio run -e esp32cam_usb -t upload
;   Later over WiFi (OTA): pio run -e esp32cam -t upload

[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
; ESP32-CAM-MB: keep DTR/RTS released, otherwise the serial monitor holds the board in reset
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = min_spiffs.csv
build_flags = -I ../include
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

upload_protocol = espota
upload_port = greenguardian-cam.local
upload_flags =
    --auth=growgreen
    --host_port=8266

[env:esp32cam_usb]
extends = env:esp32cam
upload_protocol = esptool
upload_port =
upload_flags =
